<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 1 - Servidor Web Nginx</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .status-badge {
            background-color: #2e7d32;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        h1 {
            color: #1b1b1b;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .info-box {
            background-color: #eef2f5;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: left;
        }
        .info-box ul {
            list-style: none;
        }
        .info-box li {
            margin-bottom: 8px;
        }
        .info-box li:last-child {
            margin-bottom: 0;
        }
        .info-box strong {
            color: #0288d1;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="status-badge">Contenedor Activo</span>
        <h1>¡Servidor Web Funcionando!</h1>
        <p>Este sitio está siendo servido por un contenedor Docker corriendo Nginx en su versión Alpine.</p>

        <div class="info-box">
            <ul>
                <li><strong>Proyecto:</strong> Configurar un servidor web sencillo</li>
                <li><strong>Tecnologías:</strong> Docker, Nginx (Alpine)</li>
                <li><strong>Puerto Local:</strong> 8080</li>
                <li><strong>Puerto Contenedor:</strong> 80</li>
            </ul>
        </div>
    </div>

</body>
</html>
